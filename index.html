
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>BOR HISAB</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#182235;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#101827,#233b58);color:white;padding:25px 20px 30px;border-radius:0 0 26px 26px}
.brand{font-size:13px;letter-spacing:3px;color:#9eb9d9}
h1{font-size:27px;margin:12px 0}
header p{color:#b8c8da;font-size:13px}
main{padding:18px;max-width:650px;margin:auto}
.balance{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px #17243b0b}
.balance small{color:#778398}
.amount{font-size:30px;font-weight:bold;margin-top:9px;color:#14243b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}
.stat{padding:17px;background:white;border-radius:15px}
.stat small{color:#78869a}
.stat strong{display:block;font-size:21px;margin-top:9px}
.green{color:#159768}.red{color:#e35d64}
.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.section h3{margin:0}
button{border:0;border-radius:12px;padding:13px 17px;background:#176bca;color:white;font-weight:bold;cursor:pointer}
.add{width:100%;padding:16px;font-size:15px}
input,select{width:100%;padding:14px;margin:7px 0 13px;border:1px solid #dce2eb;border-radius:11px;font-size:15px;background:white}
label{font-size:13px;color:#637188}
.customer{background:white;padding:16px;border-radius:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.customer small{color:#8190a2}
.customer strong{font-size:15px}
.empty{text-align:center;padding:25px;color:#8591a2;background:white;border-radius:15px}
nav{position:sticky;bottom:0;background:white;padding:12px;display:flex;justify-content:space-around;box-shadow:0 -4px 20px #17243b10}
nav button{background:transparent;color:#52647b;padding:10px;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#10182799;z-index:5;align-items:end;justify-content:center}
.panel{background:white;padding:23px;border-radius:24px 24px 0 0;width:100%;max-width:550px;max-height:90vh;overflow:auto}
.panel h2{margin-top:0}
.close{background:#e9eef5;color:#25354b;float:right}
.actions{display:flex;gap:10px}
.actions button{flex:1}
</style>
</head>
<body>
<header>
<div class="brand">PREMIUM BUSINESS LEDGER</div>
<h1> BOR HISAB</h1>
<p>તમારા ધંધાનો હિસાબ હવે સરળ અને સુરક્ષિત.</p>
</header>
<main>
<div class="balance">
<small>કુલ બાકી રકમ</small>
<div class="amount" id="total">₹ 0</div>
</div>
<div class="stats">
<div class="stat"><small>કુલ ગ્રાહકો</small><strong id="count">0</strong></div>
<div class="stat"><small>કુલ બાકી ગ્રાહકો</small><strong id="pending" class="red">0</strong></div>
</div>
<button class="add" onclick="openCustomer()">＋ નવો ગ્રાહક ઉમેરો</button>
<div class="section"><h3>ગ્રાહકોની યાદી</h3><span id="date"></span></div>
<div id="customers"><div class="empty">હજુ કોઈ ગ્રાહક ઉમેર્યો નથી.</div></div>
</main>
<nav>
<button onclick="location.reload()">⌂<br>Home</button>
<button onclick="openCustomer()">＋<br>ગ્રાહક</button>
<button onclick="exportData()">⇩<br>Backup</button>
</nav>

<div class="modal" id="customerModal">
<div class="panel">
<button class="close" onclick="closeModal()">બંધ કરો</button>
<h2>નવો ગ્રાહક</h2>
<label>ગ્રાહકનું નામ</label>
<input id="name" placeholder="નામ લખો">
<label>મોબાઇલ નંબર</label>
<input id="phone" placeholder="મોબાઇલ નંબર" type="tel">
<button class="add" onclick="saveCustomer()">ગ્રાહક સેવ કરો</button>
</div>
</div>

<div class="modal" id="entryModal">
<div class="panel">
<button class="close" onclick="closeEntry()">બંધ કરો</button>
<h2 id="customerTitle">ગ્રાહક હિસાબ</h2>
<div class="balance"><small>હાલનું બેલેન્સ</small><div class="amount" id="customerBalance">₹ 0</div></div>
<h3>નવો વ્યવહાર</h3>
<label>રકમ (₹)</label>
<input id="money" type="number" min="1" placeholder="રકમ દાખલ કરો">
<label>વ્યવહારનો પ્રકાર</label>
<select id="type"><option value="debit">ઉધાર / બાકી આપ્યા</option><option value="credit">જમા / પૈસા મળ્યા</option></select>
<label>વિગત</label>
<input id="note" placeholder="જેમ કે બોર, પેમેન્ટ">
<button class="add" onclick="addTransaction()">વ્યવહાર સેવ કરો</button>
<h3>વ્યવહાર ઇતિહાસ</h3>
<div id="history"></div>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('borHisabData')||'[]');
let selected=null;
const money=n=>'₹ '+Number(n).toLocaleString('en-IN');
function save(){localStorage.setItem('borHisabData',JSON.stringify(data));render()}
function balance(c){return c.entries.reduce((s,e)=>s+(e.type==='debit'?e.amount:-e.amount),0)}
function render(){
document.getElementById('customers').innerHTML=data.length?data.map((c,i)=>`
<div class="customer" onclick="openEntry(${i})">
<div><strong>${escapeHTML(c.name)}</strong><br><small>${escapeHTML(c.phone||'મોબાઇલ નથી')}</small></div>
<strong class="${balance(c)>0?'red':'green'}">${money(balance(c))}</strong>
</div>`).join(''):'<div class="empty">હજુ કોઈ ગ્રાહક ઉમેર્યો નથી.</div>';
document.getElementById('count').textContent=data.length;
document.getElementById('pending').textContent=data.filter(c=>balance(c)>0).length;
document.getElementById('total').textContent=money(data.reduce((s,c)=>s+balance(c),0));
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openCustomer(){document.getElementById('customerModal').style.display='flex'}
function closeModal(){document.getElementById('customerModal').style.display='none'}
function saveCustomer(){
let n=document.getElementById('name').value.trim();
if(!n)return alert('ગ્રાહકનું નામ લખો');
data.push({name:n,phone:document.getElementById('phone').value.trim(),entries:[]});
document.getElementById('name').value='';
document.getElementById('phone').value='';
closeModal();save();
}
function openEntry(i){
selected=i;let c=data[i];
document.getElementById('customerTitle').textContent=c.name;
document.getElementById('customerBalance').textContent=money(balance(c));
document.getElementById('history').innerHTML=c.entries.length?c.entries.slice().reverse().map(e=>`
<div class="customer"><div>${escapeHTML(e.note||'વ્યવહાર')}<br><small>${escapeHTML(e.date)}</small></div><strong class="${e.type==='debit'?'red':'green'}">${e.type==='debit'?'+':'−'} ${money(e.amount)}</strong></div>`).join(''):'<div class="empty">હજુ કોઈ વ્યવહાર નથી.</div>';
document.getElementById('entryModal').style.display='flex';
}
function closeEntry(){document.getElementById('entryModal').style.display='none'}
function addTransaction(){
let amount=Number(document.getElementById('money').value);
if(!amount||amount<=0)return alert('યોગ્ય રકમ દાખલ કરો');
data[selected].entries.push({
amount,type:document.getElementById('type').value,
note:document.getElementById('note').value.trim(),
date:new Date().toLocaleString('en-IN')
});
document.getElementById('money').value='';
document.getElementById('note').value='';
save();openEntry(selected);
}
function exportData(){
let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='bor-hisab-backup.json';a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('date').textContent=new Date().toLocaleDateString('en-IN');
render();
</script>
</body>
</html>
